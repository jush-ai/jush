[package]
name = "jush-provider-subscription-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
doctest = false
test = false
bench = false

[dependencies]
jush-shared-types = { path = "../shared-types" }
# The release records the vendors' releases are read into.
jush-command-package-subscription-cli-protocol = { path = "../command-package-subscription-cli-protocol" }
jush-device-interface = { path = "../device-interface" }
# The account operations a CLI's sign-in serves (`login.rs`).
jush-provider-common = { path = "../provider-common" }
# The build version Jush's MCP server names (`tools.rs`).
jush-shared-artifacts = { path = "../shared-artifacts" }
base64.workspace = true
bytes.workspace = true
# The in-memory transport of Jush's MCP server: rmcp takes any sink and
# stream of its messages, and these channels are both.
futures-channel = { version = "0.3", features = ["sink"] }
futures-util.workspace = true
# A release is validated as the package's protocol declares it.
garde.workspace = true
jiff.workspace = true
# The vendors' distributions, read with no redirect followed.
reqwest = { workspace = true, features = ["rustls"] }
# Jush's MCP server; `local` runs its service loop and handlers on the
# user's shard, which is one thread.
rmcp = { version = "3.4", default-features = false, features = ["local", "server"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
