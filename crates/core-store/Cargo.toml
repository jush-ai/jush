[package]
name = "jush-core-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-agent-store = { path = "../agent-store" }
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-shared-types = { path = "../shared-types", features = ["tracing"] }
jush-shared-gates = { path = "../shared-gates" }
jush-runner-client = { path = "../runner-client" }
jush-device-interface = { path = "../device-interface" }
jush-plugin-host = { path = "../plugin-host" }
jush-plugin-interface = { path = "../plugin-interface" }
jush-device-paths = { path = "../device-paths" }
jush-runner-protocol = { path = "../runner-protocol" }
jush-web-api-protocol = { path = "../web-api-protocol" }
base64.workspace = true
bytes.workspace = true
comrak = { version = "0.56", default-features = false }
futures-util.workspace = true
garde.workspace = true
hashlink = "0.12"
hex = "0.4"
jiff.workspace = true
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-rusqlite = "0.8"
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
# The contents and the records' bodies are stored compressed; the records of a
# conversation share a dictionary trained on its own (`records.rs`).
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }
