[package]
name = "jush-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
# The IANA time zones and the locale canonicalization a reported locale is
# checked against, from ICU4X's compiled data: the same on every machine,
# without a system time zone database.
icu_locale = "2"
icu_time = { version = "2", default-features = false, features = ["compiled_data"] }
jush-core-devices = { path = "../core-devices" }
jush-agent-server = { path = "../agent-server" }
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-agent-session = { path = "../agent-session" }
jush-agent-store = { path = "../agent-store" }
jush-agent-tools = { path = "../agent-tools" }
jush-agent-transcript = { path = "../agent-transcript" }
jush-core-device-access = { path = "../core-device-access" }
jush-core-idle-watch = { path = "../core-idle-watch" }
jush-core-blobs = { path = "../core-blobs" }
jush-core-providers = { path = "../core-providers" }
jush-core-store = { path = "../core-store" }
jush-core-sync = { path = "../core-sync" }
jush-core-permissions = { path = "../core-permissions" }
jush-command-package-subscription-cli-protocol = { path = "../command-package-subscription-cli-protocol" }
jush-plugin-host = { path = "../plugin-host" }
jush-plugin-interface = { path = "../plugin-interface" }
jush-command-protocol = { path = "../command-protocol" }
jush-command-declarations = { path = "../command-declarations" }
jush-shared-types = { path = "../shared-types", features = ["audio", "mp4"] }
jush-shared-gates = { path = "../shared-gates" }
jush-runner-client = { path = "../runner-client" }
jush-provider-common = { path = "../provider-common" }
jush-provider-registry = { path = "../provider-registry" }
jush-provider-relay = { path = "../provider-relay" }
jush-provider-subscription-cli = { path = "../provider-subscription-cli" }
jush-runner-protocol = { path = "../runner-protocol" }
jush-device-interface = { path = "../device-interface" }
jush-device-paths = { path = "../device-paths" }
jush-web-api-protocol = { path = "../web-api-protocol" }
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
bytes.workspace = true
async-stream = "0.3"
futures-util.workspace = true
http.workspace = true
garde.workspace = true
rand = "0.9"
reqwest = { workspace = true, features = ["rustls", "stream"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform"] }
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
# The public holidays a schedule's working days skip, kept compressed.
zstd = { version = "0.13", default-features = false }
