[package]
name = "jush-core-devices"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-core-store = { path = "../core-store" }
jush-core-sync = { path = "../core-sync" }
jush-command-protocol = { path = "../command-protocol" }
jush-shared-gates = { path = "../shared-gates" }
jush-runner-client = { path = "../runner-client", features = ["edge"] }
jush-runner-protocol = { path = "../runner-protocol" }
jush-device-interface = { path = "../device-interface" }
jush-web-api-protocol = { path = "../web-api-protocol" }
# A runner's connection is the WebSocket the edge upgraded.
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
futures-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"
