[package]
name = "jush-provider-antigravity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
doctest = false
test = false
bench = false

[dependencies]
jush-shared-types = { path = "../shared-types" }
jush-provider-common = { path = "../provider-common" }
# The release records Google's releases are read into.
jush-command-package-subscription-cli-protocol = { path = "../command-package-subscription-cli-protocol" }
jush-device-interface = { path = "../device-interface" }
# The placement its processes start through, and what every CLI shares.
jush-provider-subscription-cli = { path = "../provider-subscription-cli" }
async-stream = "0.3"
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
# The MCP messages its channel carries.
rmcp = { version = "3.4", default-features = false, features = ["local", "server"] }
# A session's database, read and written in memory (`history.rs`).
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "serialize"] }
serde.workspace = true
serde_json.workspace = true
# The private directory a running session's database is read from
# (`history.rs`).
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"
