[package]
name = "jush-core-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

# The process a program runs its cores in (`src/process/mod.rs`).
[[bin]]
name = "jush-core"
path = "src/main.rs"
test = false

[dependencies]
jush-command-protocol = { path = "../command-protocol" }
jush-provider-antigravity = { path = "../provider-antigravity" }
jush-provider-claude-code = { path = "../provider-claude-code" }
jush-provider-relay = { path = "../provider-relay" }
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-shared-cli = { path = "../shared-cli" }
jush-core-devices = { path = "../core-devices" }
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-agent-store = { path = "../agent-store" }
jush-core-device-access = { path = "../core-device-access" }
jush-core-blobs = { path = "../core-blobs" }
jush-core-providers = { path = "../core-providers" }
jush-core = { path = "../core" }
jush-core-store = { path = "../core-store" }
jush-core-sync = { path = "../core-sync" }
jush-core-permissions = { path = "../core-permissions" }
jush-plugin-host = { path = "../plugin-host" }
jush-plugin-interface = { path = "../plugin-interface" }
jush-shared-types = { path = "../shared-types" }
jush-runner-client = { path = "../runner-client", features = ["edge"] }
jush-provider-common = { path = "../provider-common" }
jush-provider-registry = { path = "../provider-registry" }
jush-provider-subscription-cli = { path = "../provider-subscription-cli" }
jush-runner-protocol = { path = "../runner-protocol" }
jush-shared-lanes = { path = "../shared-lanes" }
jush-device-interface = { path = "../device-interface" }
jush-web-api-protocol = { path = "../web-api-protocol" }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
base64.workspace = true
bytes.workspace = true
# Request IDs: 80 random bits in lowercase Crockford base-32.
data-encoding = "2"
rand = "0.9"
futures-util.workspace = true
garde.workspace = true
mime = "0.3"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
subtle = "2"
thiserror.workspace = true
# A program's connection: HTTP/2 over the process's standard input and
# output, or over TCP, where runners dial in too with HTTP/1.1; WebSockets by
# extended CONNECT.
http-body = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-auto"] }
tokio = { workspace = true, features = ["io-std", "net", "signal"] }
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
typed-path = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
rust-i18n = "4.2.4"
