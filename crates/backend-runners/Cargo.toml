[package]
name = "jush-backend-runners"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-core-devices = { path = "../core-devices" }
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-core-blobs = { path = "../core-blobs" }
jush-core-store = { path = "../core-store" }
jush-command-protocol = { path = "../command-protocol" }
jush-runner-client = { path = "../runner-client", features = ["edge"] }
jush-runner-protocol = { path = "../runner-protocol" }
jush-device-interface = { path = "../device-interface" }
jush-web-api-protocol = { path = "../web-api-protocol" }
# A runner's connection is the WebSocket the edge upgraded.
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
futures-util.workspace = true
jiff.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
percent-encoding = "2"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }
